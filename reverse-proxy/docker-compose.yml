version: "3.7"

# Both images are named by release (26.1002), never bare and never `latest`: a
# bare name means "whatever was newest on the day this server last pulled", and
# the two servers were found on two different versions, from 2021 and 2022, with
# nothing saying which. These were the newest releases on the day they were
# written here (scripts/repo-pins.test.js fails if a version goes missing).
# ⚠️ No workflow deploys this file. Changing a version here changes nothing on a
# server until the proxy is re-created there by hand (README, "docker notes").
services:
    nginx-proxy:
        image: "nginxproxy/nginx-proxy:1.11.6"
        container_name: "nginx-proxy"
        volumes:
            - "conf:/etc/nginx/conf.d"
            - "vhost:/etc/nginx/vhost.d"
            - "html:/usr/share/nginx/html"
            - "certs:/etc/nginx/certs:ro"
            - "/var/run/docker.sock:/tmp/docker.sock:ro"
        restart: "always"
        network_mode: "bridge"
        ports:
            - "80:80"
            - "443:443"

    acme-companion:
        image: "nginxproxy/acme-companion:2.8.2"
        container_name: "nginx-proxy-acme"
        volumes_from:
            - "nginx-proxy"
        volumes:
            - "certs:/etc/nginx/certs:rw"
            - "acme:/etc/acme.sh"
            - "/var/run/docker.sock:/var/run/docker.sock:ro"
        network_mode: bridge
        environment:
            DEFAULT_EMAIL: "travis@travish.com"
        restart: "always"

volumes:
    conf:
    vhost:
    html:
    certs:
    acme:
