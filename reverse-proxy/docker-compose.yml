version: "3.7"

# The two versions below are a KNOWN-GOOD REFERENCE, not what the servers run.
# Since the 26.1109 rebuilds both servers start the proxy with the bare image
# names, i.e. `latest`, and that is the chosen policy (26.1111, M-609: keep
# `latest`, with a health check after each restart and once a week, instead of
# pinning). These are releases this setup is known to work with (the newest on
# 26.1002, when they were written here): if a new `latest` breaks the proxy,
# start one of these instead. Keep them named by version
# (scripts/repo-pins.test.js fails on a bare name or `latest`), and move them
# forward only to a release that has been seen working (26.1112, M-636).
# ⚠️ No workflow deploys this file. Changing a version here changes nothing on a
# server until the proxy is re-created there by hand (README, "docker notes").
services:
    nginx-proxy:
        image: "nginxproxy/nginx-proxy:1.11.6"
        container_name: "nginx-proxy"
        volumes:
            - "conf:/etc/nginx/conf.d"
            - "vhost:/etc/nginx/vhost.d"
            - "html:/usr/share/nginx/html"
            - "certs:/etc/nginx/certs:ro"
            - "/var/run/docker.sock:/tmp/docker.sock:ro"
        restart: "always"
        network_mode: "bridge"
        ports:
            - "80:80"
            - "443:443"

    acme-companion:
        image: "nginxproxy/acme-companion:2.8.2"
        container_name: "nginx-proxy-acme"
        volumes_from:
            - "nginx-proxy"
        volumes:
            - "certs:/etc/nginx/certs:rw"
            - "acme:/etc/acme.sh"
            - "/var/run/docker.sock:/var/run/docker.sock:ro"
        network_mode: bridge
        environment:
            DEFAULT_EMAIL: "travis@travish.com"
        restart: "always"

volumes:
    conf:
    vhost:
    html:
    certs:
    acme:
