# The three headers every answer from this site carries (26.1002).
#
# ⚠️ THIS FILE IS INCLUDED INSIDE EACH `location` OF nginx.conf, ONE BY ONE, AND
# NOWHERE ELSE. In nginx a block with an `add_header` of its own silently drops
# every `add_header` from the level above: no error, no warning, the header is
# just not sent from that block. Set once at the top of the server, these would
# be missing from both calendar routes. A new location needs the include too
# (scripts/nginx-conf.test.js fails without it).
#
# `always`: without it nginx leaves a header off a 404, and a refused calendar
# route answers 404.

# A browser must believe the Content-Type it is given and never guess one.
add_header X-Content-Type-Options "nosniff" always;

# What a link out of the site tells the next site: the host, never the page.
# (Already every current browser's default; said here so it does not depend on
# the browser.)
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# No other site may show these pages inside a frame of its own. 'self' still
# lets a page of this site frame another page of this site.
add_header Content-Security-Policy "frame-ancestors 'self'" always;
