# ── ⚠️ log_format MUST be first: this file is included inside nginx's http {}
#    block (/etc/nginx/conf.d/default.conf), which is the only scope where
#    log_format is legal. Below the server block it would fail `nginx -t`.
#
# 🔔 THE GCAL PUSH RECEIVER (Praxis ticket a7cdc081, 26.0907)
# Google POSTs here when a calendar changes; the laptop reads the log and
# fetches. One line per notification — the X-Goog-* headers are ALL a
# notification carries, since Google never says WHAT changed, only that
# something did.
log_format gcal_hook '$time_iso8601 '
                     'channel=$http_x_goog_channel_id '
                     'state=$http_x_goog_resource_state '
                     'msg=$http_x_goog_message_number '
                     'resource=$http_x_goog_resource_id';

server {
    listen          80;
    listen          [::]:80;
    server_name     localhost;

    # ── ① THE DOORBELL ──────────────────────────────────────────────────────
    # ⚠️ `return 204` is terminal ON PURPOSE: nothing proxied, nothing executed,
    # no body read. Google only needs a 2xx — a non-2xx makes it retry, and
    # repeated failures make it DROP THE CHANNEL, taking the feature down
    # silently. This endpoint holds no credentials and touches no database; the
    # worst an attacker who learns the path can do is append junk lines and
    # cause a fetch that was coming within the hour anyway.
    location = /gcal-hook/27402508ba57d414026bcd14bc33a707 {
        access_log /var/log/gcal-hook/hits.log gcal_hook;
        add_header Cache-Control "no-store" always;
        return 204;
    }

    # ── ② THE DRAIN ─────────────────────────────────────────────────────────
    # The laptop GETs this and compares against what it saw last. Serving the
    # log rather than deriving a counter is deliberate: a counter is state,
    # state can be wrong, and the log is the only copy of the truth.
    # ⚠️ A SECOND, DIFFERENT SECRET — ringing the bell and reading the log are
    # separate capabilities and must not share a key.
    # The log holds only Google's channel ids and timestamps: no tokens, no
    # event data, no titles. Re-check that claim if log_format ever grows.
    location = /gcal-drain/b1f64fbfff00ce8af4f980aaf1b18af1 {
        alias /var/log/gcal-hook/hits.log;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
    }

    location        / {
        root            /var/www/html;
        try_files       $uri /index.html;
    }
}
