# ── ⚠️ log_format MUST be first: this file is included inside nginx's http {}
#    block (/etc/nginx/conf.d/default.conf), which is the only scope where
#    log_format is legal. Below the server block it would fail `nginx -t`.
#    The two `map`s below are http-scope for the same reason.
#
# 🔔 THE GCAL PUSH RECEIVER (Praxis ticket a7cdc081, 26.0907)
# Google POSTs here when a calendar changes; the laptop reads the log and
# fetches. One line per notification — the X-Goog-* headers are ALL a
# notification carries, since Google never says WHAT changed, only that
# something did.
log_format gcal_hook '$time_iso8601 '
                     'channel=$http_x_goog_channel_id '
                     'state=$http_x_goog_resource_state '
                     'msg=$http_x_goog_message_number '
                     'resource=$http_x_goog_resource_id';

# 📒 THE VISIT LOG (26.1006)
# One line per PAGE visit, kept on the droplet so it survives deploys — every
# deploy removes and recreates both containers, and their stdout log (all
# `docker logs` ever had) goes with them. The Search Console "5 clicks" email (26.1005) could only be
# traced back to 9/14, when the proxy last restarted; this is so the next
# question has history to answer it.
# client = $http_x_forwarded_for: behind nginx-proxy, $remote_addr is the
# proxy's own 172.17.x address; the visitor's IP arrives in that header.
# ⚠️ IPs are personal data. This log is NEVER served — no location below has a
# root under /var/log/www — and the repo/image are public, so the file only
# ever exists on the droplet.
log_format visits '$time_iso8601 '
                  'client=$http_x_forwarded_for '
                  'host=$host '
                  '"$request_method $request_uri" $status $body_bytes_sent '
                  'ref="$http_referer" '
                  'ua="$http_user_agent"';

# Pages only: the asset requests that ride along with every page load
# (the hashed JS/CSS bundles, fonts, images) would bury the visits ~5:1.
# robots.txt and sitemap.xml (26.1009) are read by search engines, not people.
map $uri $visit_log {
    ~*\.(js|css|map|png|jpe?g|gif|svg|ico|webp|woff2?|ttf|otf|webmanifest|txt|xml)$   0;
    default                                                                           1;
}

# 🗜 COMPRESSION (26.1009). Until now nothing was compressed: the script went
# out at 362 KB where gzip makes it about 112 KB, and the stylesheet at 15.7 KB
# instead of 4.2 KB. http scope, so it covers every location. Not listed:
# text/html, which nginx always compresses once gzip is on, and the pictures
# and the PDF, which are compressed already. gzip_vary tells caches in between
# that a compressed and a plain copy are different answers.
gzip              on;
gzip_vary         on;
gzip_comp_level   6;
gzip_min_length   1024;
gzip_types        application/javascript text/css image/svg+xml application/json font/ttf font/otf text/plain text/xml;

# The two font types nginx's own list does not know: without these, the .ttf
# and .otf files went out as application/octet-stream (and so uncompressed).
# A `types` block here ADDS to the list nginx loaded above this file; inside the
# server it would REPLACE the whole list.
types {
    font/ttf    ttf;
    font/otf    otf;
}

# ── 🔑 THE CAPABILITY PATHS ARE NOT IN THIS FILE (rotated 26.0911, ticket 63ba96c0)
# This repo is PUBLIC, and so is the image built from it (Docker Hub
# kiddspazz/www_web). Both secret path segments used to be literal here, which
# published them. They now live in ONE untracked file on the droplet, bind-
# mounted read-only into the `web` container at run time:
#
#     host   /etc/gcal-hook/capabilities.map    (chmod 600, root)
#     inside /etc/nginx/gcal/capabilities.map
#
# holding exactly two lines of map DATA and no logic:
#
#     /gcal-hook/<32 hex>   hook;
#     /gcal-drain/<32 hex>  drain;
#
# Everything that decides what those paths DO stays here, in review.
#
# ⚠️ FAILS CLOSED, BY CONSTRUCTION. The include is a glob, and a glob that
# matches nothing is legal in nginx, so a container with no file — `www_web`,
# the dev droplet, a fresh host — still boots, and every /gcal-hook/… and
# /gcal-drain/… request gets 404. A missing secret can never become an open
# route; it can only become a closed one.
# ⚠️ But a PRESENT and MALFORMED file fails `nginx -t` and the container will not
# start. Check a new file with `nginx -t` inside the image before deploying
# (the runbook in the rotation PR has the one-liner).
map $uri $gcal_route {
    default     "";
    include     /etc/nginx/gcal/*.map;
}

# Only a real ring is written to the doorbell's log. Probes of wrong paths are
# refused (404) and NOT appended, so the drain never serves a stranger's junk.
map $gcal_route $gcal_log_hook {
    hook        1;
    default     0;
}

# 💬 THE CHAT (26.1010): what a proxied request says about its connection.
# A browser opening the chat's live connection asks to "upgrade" it to a
# WebSocket; that request must reach the chat server as an upgrade, and every
# other request as an ordinary one. http scope, like the maps above.
map $http_upgrade $connection_upgrade {
    default     upgrade;
    ''          close;
}

server {
    listen          80;
    listen          [::]:80;
    server_name     localhost;

    # This container's answers (and the 404 page's body) say `nginx`, not
    # which version (26.1002). Without this the 404 page that ③ introduces
    # would print the version in its body. ⚠️ The Server header VISITORS see
    # is not this one: it comes from nginx-proxy in front, which still names
    # its own version (corrected 26.1009).
    server_tokens   off;

    # ── ⓪ THE SECURITY HEADERS ARE INCLUDED IN EVERY LOCATION (26.1002) ──────
    # ⚠️ Each location below has the same `include …/security-headers.conf;`
    # line, and that is on purpose. A block with an `add_header` of its own
    # silently DROPS every `add_header` from the level above, so three headers
    # set once here would be missing from ① and ②, which each set
    # Cache-Control. A new location needs the line too.

    # ── ① THE DOORBELL ──────────────────────────────────────────────────────
    # ⚠️ `return 204` is terminal ON PURPOSE: nothing proxied, nothing executed,
    # no body read. Google only needs a 2xx — a non-2xx makes it retry, and
    # repeated failures make it DROP THE CHANNEL, taking the feature down
    # silently. This endpoint holds no credentials and touches no database; the
    # worst an attacker who learns the path can do is append junk lines and
    # cause a fetch that was coming within the hour anyway.
    # `if … return` is the one form of `if` nginx documents as safe.
    location ^~ /gcal-hook/ {
        if ($gcal_route != "hook") { return 404; }
        access_log /var/log/gcal-hook/hits.log gcal_hook if=$gcal_log_hook;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        return 204;
    }

    # ── ② THE DRAIN ─────────────────────────────────────────────────────────
    # The laptop GETs this and compares against what it saw last. Serving the
    # log rather than deriving a counter is deliberate: a counter is state,
    # state can be wrong, and the log is the only copy of the truth.
    # ⚠️ A SECOND, DIFFERENT SECRET — ringing the bell and reading the log are
    # separate capabilities and must not share a key.
    # The log holds only Google's channel ids and timestamps: no tokens, no
    # event data, no titles. Re-check that claim if log_format ever grows.
    # (root + try_files rather than `alias`: in a prefix location `alias` would
    # append the secret to the file name.)
    location ^~ /gcal-drain/ {
        if ($gcal_route != "drain") { return 404; }
        root            /var/log/gcal-hook;
        try_files       /hits.log =404;
        default_type    text/plain;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    # ── ②½ /journal IS GONE FOR GOOD (26.1009) ───────────────────────────────
    # The hidden journal page was removed on 26.0913, but /journal still
    # answered 200 with the app (④ answers every address), so search engines
    # had no reason ever to drop it. 410 Gone says it will not come back. `^~`
    # so it also covers anything under /journal/, and no regex location can
    # take it. No Cache-Control: a 410 may be remembered, and it is final.
    location ^~ /journal {
        if ($host = travish.com) { return 301 https://www.travish.com$request_uri; }
        include /etc/nginx/snippets/security-headers.conf;
        return 410;
    }

    # ── ②¾ THE CHAT, /chat/ (26.1010) ───────────────────────────────────────
    # react-chat (git submodule services/react-chat) runs in its own container,
    # `chat`, which the deploy workflows start BEFORE this one, on a private
    # docker network (www-chat) that this container also joins. It is never
    # announced to the proxy in front (no VIRTUAL_HOST): the only way in is
    # through here. It is started with BASE_PATH=/chat, so the address is
    # passed through unchanged, and the page, its files and its live connection
    # (/chat/socket.io/) all answer under it.
    #
    # ⚠️ THE CHAT CAN NEVER TAKE THE SITE DOWN. A host name written straight
    # into proxy_pass is looked up ONCE, when nginx starts, and a name that does
    # not resolve stops nginx from starting at all: one missing chat container
    # would have taken www.travish.com with it. Through a variable it is looked
    # up per request instead, at docker's own name server (127.0.0.11, which
    # answers on that private network), so this container starts whether or
    # not `chat` exists; without it, /chat/ alone answers 502. valid=10s: a
    # recreated `chat` gets a new address, picked up within 10 s.
    #
    # The bare domain redirects first, like every page. No Cache-Control of
    # ours: the chat server says its own (and a second one would double it).
    # proxy_connect_timeout 5s: a chat that is gone fails in 5 s, not 60.
    # proxy_read_timeout 1h: a quiet live connection is not cut after nginx's
    # default 60 s (socket.io also pings every 25 s).
    location = /chat {
        if ($host = travish.com) { return 301 https://www.travish.com$request_uri; }
        include /etc/nginx/snippets/security-headers.conf;
        # Relative (`Location: /chat/`): an absolute one would name this
        # container's own http:// address, not the https:// one the visitor used.
        absolute_redirect off;
        return 301 /chat/;
    }

    location ^~ /chat/ {
        if ($host = travish.com) { return 301 https://www.travish.com$request_uri; }
        resolver            127.0.0.11 valid=10s ipv6=off;
        resolver_timeout    3s;
        set $chat_upstream  chat:8081;
        proxy_pass          http://$chat_upstream;
        proxy_http_version  1.1;
        proxy_set_header    Host $host;
        proxy_set_header    Upgrade $http_upgrade;
        proxy_set_header    Connection $connection_upgrade;
        proxy_connect_timeout 5s;
        proxy_read_timeout  1h;
        proxy_send_timeout  1h;
        proxy_buffering     off;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # ── ③ BUILT FILES: KEPT FOR A YEAR, AND A REAL 404 WHEN GONE (26.1002) ───
    # Every file the build writes except index.html has a hash of its own
    # content in its name (app.dd8b2794.js, resume.e1370cb9.pdf, and the .map
    # beside a script or stylesheet). A changed file is a NEW name, so a browser
    # may keep one for a year and never ask again: `immutable`.
    # The other half is `try_files $uri =404`. Before this location a missing
    # file fell through to ④ and was answered with index.html and a 200. After
    # an update, a browser still holding the old page asked for the old script,
    # got a web page back, could not run it, and showed a blank page.
    # ⚠️ THE PATTERN IS IN QUOTES ON PURPOSE: unquoted, nginx reads the `{` of
    # `{8}` as the start of a block and refuses the file.
    # ⚠️ NO `always` ON THE CACHE HEADER, ON PURPOSE: with it the 404 for a
    # missing file would itself be kept for a year. (The security headers in the
    # include do say `always`; they belong on a 404.)
    # ① and ② are `^~` locations: for a path under them nginx never looks at a
    # regex location, so nothing shaped like a built file can leave them.
    # The same redirect as ④, for the same reason: the bare domain serves
    # nothing itself.
    # (scripts/check-bundle.mjs, which the `test` check runs on every pull
    # request, goes red if a built file's name does not fit this pattern. It
    # stops no build and no deploy: a file that slipped past it would be
    # answered by ④, with `no-cache`, which is safe and merely slower.)
    location ~ "\.[0-9a-f]{8}\.[a-z0-9]+(\.map)?$" {
        if ($host = travish.com) { return 301 https://www.travish.com$request_uri; }
        root            /var/www/html;
        try_files       $uri =404;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ── ④ ONE CANONICAL HOST (26.0917) ──────────────────────────────────────
    # www.travish.com is the site; the bare domain 301s to it, path and query
    # intact. Search Console had flagged the pair as "duplicate without
    # user-selected canonical" — same bundle on two hosts, nothing saying which.
    # ⚠️ SCOPED TO THIS LOCATION ON PURPOSE. ① and ② above are prefix locations
    # that never enter here, and Google's push channels address
    # https://travish.com/gcal-hook/… — a server-level `return` would have
    # answered them with a 301, and Google drops a channel that stops getting
    # its 2xx. nginx-proxy forwards the browser's Host header, so $host is the
    # name that was typed. `if … return` is the one form of `if` nginx
    # documents as safe. kiddspazz.com (dev) is untouched by this.
    #
    # `no-cache` (26.1002): everything answered here is index.html, the one
    # file whose name never changes and which names all the others. A browser
    # may keep it but must ask "still the same?" before every use, so a visitor
    # gets the new site as soon as it is deployed. An address that is no page
    # of the app still gets index.html here (nginx cannot know the app's
    # routes); the app shows its own "not found".
    # The redirect above carries the header too, so a browser asks for it
    # again each visit instead of remembering it for good.
    location        / {
        # 📒 The visit log (top of file). Declaring any access_log here drops the
        # inherited one, so the stdout log is restated first: `docker logs`
        # keeps working exactly as before.
        access_log      /var/log/nginx/access.log main;
        access_log      /var/log/www/visits.log visits if=$visit_log;
        if ($host = travish.com) { return 301 https://www.travish.com$request_uri; }
        root            /var/www/html;
        try_files       $uri /index.html;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
    }
}
