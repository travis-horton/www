name: production environment

on:
  push:
    branches:
      - 'main'

jobs:
  deploy-new-web-app:
    runs-on: ubuntu-latest
    steps:
      -
        # Only to read the content hash below; nothing is built here. Production
        # never builds (Travis, 26.0918: "nothing can get to prod that hasn't been
        # in the sandbox environment").
        name: Checkout
        uses: actions/checkout@v4

      -
        # Production runs the sandbox's build OF THESE EXACT FILES: the image
        # tagged tree-<git's hash of main's tree>, which deploy-to-dev pushes for
        # every dev commit. Before this, prod pulled :latest — whatever dev built
        # last, which a main merge would ship even when it wasn't what the merge
        # contained (26.0910).
        #
        # A release merge has the same tree as the dev commit it releases, so its
        # image is already on Docker Hub. The history bot's follow-up commit on
        # main (HISTORY.md + the version bump) is new content: dev rebuilds it
        # once the bot fast-forwards dev (~2.5 min), so this step waits for that
        # build. If it never appears, the job fails and NOTHING is deployed —
        # the running site is left exactly as it was.
        name: Wait for the sandbox build of this content
        id: image
        run: |
          TREE=$(git rev-parse 'HEAD^{tree}')
          TAG="tree-$TREE"
          URL="https://hub.docker.com/v2/repositories/kiddspazz/www_web/tags/$TAG"
          for i in $(seq 1 45); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$URL")
            if [ "$code" = 200 ]; then
              echo "found kiddspazz/www_web:$TAG"
              echo "tag=$TAG" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "no sandbox build of $TAG yet (Docker Hub answered $code); waiting 20 s ($i/45)"
            sleep 20
          done
          echo "::error::The sandbox (dev) never built main's exact content (kiddspazz/www_web:$TAG) within 15 min. Nothing was deployed. Check the 'development environment' run for this commit, then re-run this job."
          exit 1

      -
        name: Deploy web app to travish.com
        uses: appleboy/ssh-action@v0.1.3
        with:
          host: ${{ secrets.DIGITALOCEAN_HOST_PROD }}
          username: ${{ secrets.DIGITALOCEAN_USERNAME_PROD }}
          key: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          script: |
            IMAGE=kiddspazz/www_web:${{ steps.image.outputs.tag }}
            docker pull "$IMAGE"
            # --restart unless-stopped (not --rm): the containers come back by
            # themselves when the droplet reboots. With --rm a reboot DELETED
            # them and the site stayed down until the next push (26.0913).
            # rm -f replaces the old stop + rm pairs: a stopped container is no
            # longer removed for us, and -f also clears one left mid-restart.
            docker rm -f web www_web || true
            mkdir -p /var/log/gcal-hook
            # -v: the gcal push receiver's log MUST outlive the container.
            # Every deploy replaces the container, so without this the doorbell's
            # memory is wiped on every deploy — and an empty log is
            # indistinguishable from "nothing changed", which is the one thing
            # this design must never fake. (Praxis ticket a7cdc081, 26.0907)
            # -v /etc/gcal-hook: the capability map, an UNTRACKED file that lives
            # only on this droplet (ticket 63ba96c0, 26.0911). ⚠️ Place it BEFORE
            # the deploy that first carries this line: without it the receiver
            # answers 404 and Google eventually drops the channels. `www_web`
            # gets no mount on purpose — the receiver lives on travish.com only.
            mkdir -p /etc/gcal-hook
            docker run --restart unless-stopped --name web -e VIRTUAL_HOST=travish.com \
              -e LETSENCRYPT_HOST=travish.com -e VIRTUAL_PORT=80 \
              -v /var/log/gcal-hook:/var/log/gcal-hook \
              -v /etc/gcal-hook:/etc/nginx/gcal:ro \
              -d "$IMAGE"
            docker run --restart unless-stopped --name www_web -e VIRTUAL_HOST=www.travish.com \
              -e LETSENCRYPT_HOST=www.travish.com -e VIRTUAL_PORT=80 \
              -d "$IMAGE"
            # Keep the job's verdict: ssh-action reports the script's LAST exit
            # status, which until now was the docker run above. The cleanup
            # below must not be able to hide a failed deploy, or cause one.
            deploy_rc=$?
            # Clean up old images, ONLY once the new site is up. Every build is
            # tagged (:<commit>, :tree-<hash>), so replaced images no longer
            # turn into <none> — without this they pile up until the disk fills.
            # `prune -a` never touches an image any container uses (running OR
            # stopped: the live site, nginx-proxy, acme-companion), and
            # until=168h also spares anything BUILT in the last 7 days. ⚠️ The
            # clock is the image's BUILD time, not when it was deployed here:
            # after a quiet month the previous release is usually older than a
            # week and is removed from this droplet. Rolling back is then a
            # pull from Docker Hub, which keeps every tag:
            #   docker pull kiddspazz/www_web:tree-<hash>
            if [ "$deploy_rc" -eq 0 ] \
              && [ -n "$(docker ps -q --filter 'name=^/?web$' --filter status=running --filter "ancestor=$IMAGE")" ] \
              && [ -n "$(docker ps -q --filter 'name=^/?www_web$' --filter status=running --filter "ancestor=$IMAGE")" ]; then
              docker image prune -a -f --filter 'until=168h' || echo "image prune failed; the deploy itself is fine"
            else
              echo "Skipping image cleanup: the new containers are not both running $IMAGE"
            fi
            exit "$deploy_rc"
