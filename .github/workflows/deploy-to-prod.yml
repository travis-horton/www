name: production environment

on:
  push:
    branches:
      - 'main'
  # ROLLBACK (26.1009). Before this the only trigger was a push to main, and
  # re-running an old production run does not bring an old build back: a run
  # from before 26.0928 deploys dev's newest :latest. Now an older main commit
  # can be deployed by hand; its own sandbox-proven image is pulled:
  #   gh workflow run 'production environment' --repo travis-horton/www --ref main -f ref=<old main commit>
  # Only releases from 26.0928 on have the tree-<hash> image this looks for.
  workflow_dispatch:
    inputs:
      ref:
        description: 'The main commit to deploy (empty = the newest main)'
        required: false
        default: ''

# What this workflow's own GitHub token may do: read the repository, nothing
# else. Without this block it gets the repository's default token, which can
# write. The server key below is a separate secret and is not affected.
permissions:
  contents: read

# Every `uses:` below is pinned to a full commit, with the release it belongs to
# in the comment. A tag can be moved to different code after the fact; a commit
# cannot, and the deploy step hands its action the SSH key to production.
jobs:
  deploy-new-web-app:
    runs-on: ubuntu-latest
    steps:
      -
        # Only to read the content hash below; nothing is built here. Production
        # never builds (Travis, 26.0918: "nothing can get to prod that hasn't been
        # in the sandbox environment").
        # A rollback (workflow_dispatch above) checks out the commit it names;
        # a push checks out the commit that was pushed, as before.
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}

      -
        # Production runs the sandbox's build OF THESE EXACT FILES: the image
        # tagged tree-<git's hash of main's tree>, which deploy-to-dev adds to a
        # build only once that build is up and healthy in the sandbox (since
        # 26.1009; before, it was tagged before the sandbox had tried it).
        # Before 26.0928, prod pulled :latest — whatever dev built
        # last, which a main merge would ship even when it wasn't what the merge
        # contained (26.0910).
        #
        # A release merge has the same tree as the dev commit it releases, so its
        # image is already on Docker Hub. The history bot's follow-up commit on
        # main (HISTORY.md + the version bump) is new content: dev rebuilds it
        # once the bot fast-forwards dev (~2.5 min), so this step waits for that
        # build. If it never appears, the job fails and NOTHING is deployed —
        # the running site is left exactly as it was.
        name: Wait for the sandbox build of this content
        id: image
        run: |
          TREE=$(git rev-parse 'HEAD^{tree}')
          TAG="tree-$TREE"
          URL="https://hub.docker.com/v2/repositories/kiddspazz/www_web/tags/$TAG"
          for i in $(seq 1 45); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$URL")
            if [ "$code" = 200 ]; then
              echo "found kiddspazz/www_web:$TAG"
              echo "tag=$TAG" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "no sandbox build of $TAG yet (Docker Hub answered $code); waiting 20 s ($i/45)"
            sleep 20
          done
          echo "::error::The sandbox (dev) never built main's exact content (kiddspazz/www_web:$TAG) within 15 min. Nothing was deployed. Check the 'development environment' run for this commit, then re-run this job."
          exit 1

      -
        name: Deploy web app to travish.com
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.DIGITALOCEAN_HOST_PROD }}
          username: ${{ secrets.DIGITALOCEAN_USERNAME_PROD }}
          # Production's OWN key if there is one, else the key the sandbox also
          # uses. Until a secret named DIGITALOCEAN_ACCESS_TOKEN_PROD exists
          # this is exactly the old behaviour; the day it is added, production
          # switches to it with no change here. After that the shared key can
          # be taken off the production server, and a leak of the sandbox's
          # key no longer reaches production.
          key: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN_PROD || secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          script: |
            IMAGE=kiddspazz/www_web:${{ steps.image.outputs.tag }}
            # Stop HERE if the pull fails (Docker Hub blip, rate limit): this
            # script has no set -e, and the old site's image is under a
            # different tag, so carrying on would remove the running
            # containers and then fail to start the new ones — nothing serving.
            docker pull "$IMAGE" || { echo "pull of $IMAGE failed; live site left untouched"; exit 1; }
            # --restart unless-stopped (not --rm): the containers come back by
            # themselves when the droplet reboots. With --rm a reboot DELETED
            # them and the site stayed down until the next push (26.0913).
            # rm -f replaces the old stop + rm pairs: a stopped container is no
            # longer removed for us, and -f also clears one left mid-restart.
            docker rm -f web www_web || true
            mkdir -p /var/log/gcal-hook
            # -v: the gcal push receiver's log MUST outlive the container.
            # Every deploy replaces the container, so without this the doorbell's
            # memory is wiped on every deploy — and an empty log is
            # indistinguishable from "nothing changed", which is the one thing
            # this design must never fake. (Praxis ticket a7cdc081, 26.0907)
            # -v /etc/gcal-hook: the capability map, an UNTRACKED file that lives
            # only on this droplet (ticket 63ba96c0, 26.0911). ⚠️ Place it BEFORE
            # the deploy that first carries this line: without it the receiver
            # answers 404 and Google eventually drops the channels. `www_web`
            # gets no mount on purpose — the receiver lives on travish.com only.
            mkdir -p /etc/gcal-hook
            # -v /var/log/www: the visit log (26.1006), on BOTH containers —
            # www.travish.com is the canonical host, so most visits land on
            # www_web. Both append to one file; each line is a single write.
            # No mkdir: the deploy user can't create dirs under /var/log, and
            # Docker creates a missing bind-mount source itself (as root).
            docker run --restart unless-stopped --name web -e VIRTUAL_HOST=travish.com \
              -e LETSENCRYPT_HOST=travish.com -e VIRTUAL_PORT=80 \
              -v /var/log/gcal-hook:/var/log/gcal-hook \
              -v /etc/gcal-hook:/etc/nginx/gcal:ro \
              -v /var/log/www:/var/log/www \
              -d "$IMAGE"
            docker run --restart unless-stopped --name www_web -e VIRTUAL_HOST=www.travish.com \
              -e LETSENCRYPT_HOST=www.travish.com -e VIRTUAL_PORT=80 \
              -v /var/log/www:/var/log/www \
              -d "$IMAGE"
            # Keep the job's verdict: ssh-action reports the script's LAST exit
            # status, which until now was the docker run above. The cleanup
            # below must not be able to hide a failed deploy, or cause one.
            deploy_rc=$?
            # Is the new site actually up? Both containers must be RUNNING,
            # started from $IMAGE (the build this run just pulled), and must
            # NEVER have restarted. The last part is what makes this reliable:
            # with --restart unless-stopped a container that dies on start (a
            # bad nginx config exits at once) is not removed, it crash-loops,
            # and Docker shows it "running" for the moment between restarts.
            # Its restart count, though, only goes up. Checked after a short
            # wait so a container that dies in its first seconds has done so.
            # Before this, the job only knew whether the LAST command succeeded,
            # so it could go green with travish.com down (26.0925).
            sleep 5
            site_up=1
            for c in web www_web; do
              restarts=$(docker inspect -f '{{.RestartCount}}' "$c" 2>/dev/null || echo unknown)
              if [ -z "$(docker ps -q --filter "name=^/?$c\$" --filter status=running --filter "ancestor=$IMAGE")" ]; then
                echo "DEPLOY FAILED: container '$c' is not running $IMAGE"
                docker ps -a --filter "name=^/?$c\$" || true
                site_up=0
              elif [ "$restarts" != 0 ]; then
                echo "DEPLOY FAILED: container '$c' has restarted since it started (restart count: $restarts), so it is crash-looping"
                docker ps -a --filter "name=^/?$c\$" || true
                site_up=0
              fi
            done
            # Clean up old images, ONLY once the new site is up. Every build is
            # tagged (:<commit>, :tree-<hash>), so replaced images no longer
            # turn into <none> — without this they pile up until the disk fills.
            # `prune -a` never touches an image any container uses (running OR
            # stopped: the live site, nginx-proxy, acme-companion), and
            # until=168h also spares anything BUILT in the last 7 days. ⚠️ The
            # clock is the image's BUILD time, not when it was deployed here:
            # after a quiet month the previous release is usually older than a
            # week and is removed from this droplet. Rolling back is then a
            # pull from Docker Hub, which keeps every tag:
            #   docker pull kiddspazz/www_web:tree-<hash>
            if [ "$deploy_rc" -eq 0 ] && [ "$site_up" -eq 1 ]; then
              docker image prune -a -f --filter 'until=168h' || echo "image prune failed; the deploy itself is fine"
            else
              echo "Skipping image cleanup: the deploy did not finish with the new site up"
            fi
            # The verdict: a failed deploy command keeps its own exit status;
            # otherwise the job fails when the site is not up.
            if [ "$deploy_rc" -ne 0 ]; then exit "$deploy_rc"; fi
            if [ "$site_up" -ne 1 ]; then exit 1; fi
            exit 0
