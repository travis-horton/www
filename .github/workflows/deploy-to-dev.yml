name: development environment

on:
  push:
    branches:
      - 'dev'

jobs:
  deploy-new-web-app:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      -
        name: Login to DockerHub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      -
        # The build's own time, Boise, YY.MMDD.HHMM — shown in the footer after the
        # version (v3.28.0+26.0918.1600). Production runs this same image.
        name: Stamp the build time
        id: stamp
        run: echo "build_date=$(TZ=America/Boise date +%y.%m%d.%H%M)" >> "$GITHUB_OUTPUT"

      -
        # The version this build will carry when it is released: HISTORY.md's newest
        # stamp, bumped by the feature PRs waiting on dev — the same calculation the
        # release's own merge makes (scripts/history-append.mjs). Production runs this
        # exact image, so the number has to be decided here. Never blocks a deploy:
        # on any failure the footer falls back to package.json's version.
        name: Work out the release version
        id: version
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HISTORY_RELEASE_FROM: ${{ vars.HISTORY_RELEASE_FROM }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: node scripts/history-append.mjs --predict

      -
        # The image's CONTENT ADDRESS: git's hash of the whole checked-out tree.
        # Production looks its image up by this (deploy-to-prod.yml), so prod can
        # only ever run a build the sandbox made from exactly the files on main —
        # never "whatever dev built last". A release merge has the same tree as
        # the dev commit it releases, so the tag is already here when prod asks.
        name: Name the image by its content
        id: tree
        run: echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"

      -
        # Three tags on one image: :latest (kept for hand use on the droplets),
        # :<commit> (this deploy pulls it — immutable, so a slower run can never
        # pick up a newer build) and :tree-<content hash> (what production pulls).
        name: Build and push
        id: docker_build
        uses: docker/build-push-action@v2
        with:
          context: .
          push: true
          tags: |
            kiddspazz/www_web:latest
            kiddspazz/www_web:${{ github.sha }}
            kiddspazz/www_web:tree-${{ steps.tree.outputs.tree }}
          build-args: |
            GIT_HASH=${{ github.sha }}
            BUILD_DATE=${{ steps.stamp.outputs.build_date }}
            APP_VERSION=${{ steps.version.outputs.version }}

      -
        name: Deploy web app to kiddspazz.com
        uses: appleboy/ssh-action@v0.1.3
        with:
          host: ${{ secrets.DIGITALOCEAN_HOST }}
          username: ${{ secrets.DIGITALOCEAN_USERNAME }}
          key: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          script: |
            # The exact build this run just pushed — not :latest, which a newer
            # push can move while this run is still going.
            IMAGE=kiddspazz/www_web:${{ github.sha }}
            docker pull "$IMAGE"
            # --restart unless-stopped (not --rm): the containers come back by
            # themselves when the droplet reboots. With --rm a reboot DELETED
            # them and the site stayed down until the next push (26.0913).
            # rm -f replaces the old stop + rm pairs: a stopped container is no
            # longer removed for us, and -f also clears one left mid-restart.
            docker rm -f web www_web || true
            mkdir -p /var/log/gcal-hook
            # -v: the gcal push receiver's log must outlive the container, which
            # every deploy replaces. Mirrored from deploy-to-prod so DEV IS A
            # TRUE DRESS REHEARSAL — without it dev would prove the nginx config
            # parses but not that the doorbell can actually remember anything,
            # and the remembering is the half that fails silently.
            # (Praxis ticket a7cdc081, 26.0907)
            # -v /etc/gcal-hook: the capability map, an UNTRACKED file that lives
            # only on the droplet (ticket 63ba96c0, 26.0911). No file → the
            # routes 404, so dev deploys fine without one; put a dev-only pair
            # there to rehearse the receiver end to end.
            mkdir -p /etc/gcal-hook
            docker run --restart unless-stopped --name web -e VIRTUAL_HOST=kiddspazz.com \
              -e LETSENCRYPT_HOST=kiddspazz.com -e VIRTUAL_PORT=80 \
              -v /var/log/gcal-hook:/var/log/gcal-hook \
              -v /etc/gcal-hook:/etc/nginx/gcal:ro \
              -d "$IMAGE"
            docker run --restart unless-stopped --name www_web -e VIRTUAL_HOST=www.kiddspazz.com \
              -e LETSENCRYPT_HOST=www.kiddspazz.com -e VIRTUAL_PORT=80 \
              -d "$IMAGE"
            # kiddspazz.com is the SANDBOX and must never be indexed: the same
            # bundle serves travish.com, and Search Console flagged the pair as
            # "duplicate without user-selected canonical" (26.0917). nginx-proxy
            # includes vhost.d/<host> inside that host's server block, so an
            # add_header there applies to every response for the host and sits
            # beside (not instead of) the HSTS header the proxy adds itself.
            # Written through the proxy container because vhost.d is a named
            # volume; reload picks it up without touching the certs. Verify:
            #   curl -sI https://kiddspazz.com | grep -i x-robots-tag
            for h in kiddspazz.com www.kiddspazz.com; do
              docker exec nginx-proxy sh -c "printf 'add_header X-Robots-Tag \"noindex, nofollow\" always;\n' > /etc/nginx/vhost.d/$h"
            done
            docker exec nginx-proxy nginx -s reload
            # Keep the job's verdict: ssh-action reports the script's LAST exit
            # status, which until now was the reload above. The cleanup below
            # must not be able to hide a failed deploy, or cause one.
            deploy_rc=$?
            # Is the new site actually up? Both containers must be RUNNING and
            # started from $IMAGE, the build this run just pulled. Checked after
            # a short wait so a container that dies on start (a bad nginx config
            # exits at once) is caught instead of passing in its first second.
            # Before this, the job only knew whether the LAST command succeeded,
            # so it could go green with the site down (26.0925).
            sleep 5
            site_up=1
            for c in web www_web; do
              if [ -z "$(docker ps -q --filter "name=^/?$c\$" --filter status=running --filter "ancestor=$IMAGE")" ]; then
                echo "DEPLOY FAILED: container '$c' is not running $IMAGE"
                docker ps -a --filter "name=^/?$c\$" || true
                site_up=0
              fi
            done
            # Clean up old images, ONLY once the new site is up. Every build is
            # tagged (:<commit>, :tree-<hash>), so replaced images no longer
            # turn into <none> — without this they pile up until the disk fills.
            # `prune -a` never touches an image any container uses (running OR
            # stopped: the new site, nginx-proxy, acme-companion), and
            # until=168h also spares anything BUILT in the last 7 days, so a
            # week of builds stays on hand for a rollback. Older builds are
            # still on Docker Hub: `docker pull kiddspazz/www_web:<commit>`.
            if [ "$deploy_rc" -eq 0 ] && [ "$site_up" -eq 1 ]; then
              docker image prune -a -f --filter 'until=168h' || echo "image prune failed; the deploy itself is fine"
            else
              echo "Skipping image cleanup: the deploy did not finish with the new site up"
            fi
            # The verdict: a failed deploy command keeps its own exit status;
            # otherwise the job fails when the site is not up.
            if [ "$deploy_rc" -ne 0 ]; then exit "$deploy_rc"; fi
            if [ "$site_up" -ne 1 ]; then exit 1; fi
            exit 0
